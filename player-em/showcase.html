<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Before and after</title>
<style>
/* the references' showcase: a light page, the raw take small and low on the left, the edit large on the right, both in step */
:root { --page: oklch(0.975 0.004 80); --ink: oklch(0.2 0.01 60); --mute: oklch(0.52 0.01 60); }
html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; font-family: 'Inter Tight', system-ui, sans-serif; }
@font-face { font-family: 'Inter Tight'; src: url('/assets/renderer/fonts/inter-tight-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
#sc { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; background: var(--page); }
.tag { position: absolute; font: 600 30px 'Inter Tight'; color: var(--ink); letter-spacing: -.01em; }
.card { position: absolute; overflow: hidden; border-radius: 26px; background: #111; box-shadow: 0 30px 70px rgba(40, 30, 20, .22), 0 6px 18px rgba(40, 30, 20, .12); }
#before { left: 60px; top: 560px; width: 380px; height: 676px; }
#before video { width: 100%; height: 100%; object-fit: cover; }
#after { left: 330px; top: 300px; width: 690px; height: 1227px; z-index: 2; }
#after iframe { width: 690px; height: 1227px; border: 0; display: block; }
#name { position: absolute; left: 0; right: 0; top: 1620px; text-align: center; }
#name b { display: block; font: 800 88px/1 'Inter Tight'; letter-spacing: -.03em; color: var(--ink); }
#name span { display: block; margin-top: 16px; font: 500 34px 'Inter Tight'; color: var(--mute); }
#go { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: rgba(250, 248, 244, .6); backdrop-filter: blur(6px); font: 700 54px 'Inter Tight'; color: var(--ink); cursor: pointer; }
</style></head>
<body>
<div id="sc">
  <div class="tag" style="left:60px;top:508px">Before</div>
  <div class="card" id="before"><video id="bv" muted playsinline preload="auto"></video></div>
  <div class="tag" style="left:330px;top:248px">After</div>
  <div class="card" id="after"><iframe id="af"></iframe></div>
  <div id="name"><b>Moovi</b><span>raw take in, edit out</span></div>
  <div id="go">loading…</div>
</div>
<script type="module">
const Q = new URLSearchParams(location.search), spec = Q.get('spec') || 'specs/edit-t3-fourwhy.json';
const sc = document.getElementById('sc'), af = document.getElementById('af'), bv = document.getElementById('bv'), go = document.getElementById('go');
const fit = () => { const k = Math.min(innerWidth / 1080, innerHeight / 1920); sc.style.transform = `translate(${(innerWidth - 1080 * k) / 2}px,${(innerHeight - 1920 * k) / 2}px) scale(${k})`; };
addEventListener('resize', fit); fit();
af.src = `player.html?spec=${encodeURIComponent(spec)}&embed=1`;
const S = await (await fetch(spec)).json();
bv.src = S.clip.replace(/\/?$/, '/') + 'cut.mp4';            // the raw take on the edit's own clock (the same cut, no grade, no graphics)
await new Promise(r => { const t = setInterval(() => { try { if (af.contentWindow.__ready) { clearInterval(t); r(); } } catch {} }, 150); });
const W = af.contentWindow, V = W.document.getElementById('v');
W.document.getElementById('gate').style.display = 'none';
// the raw take frames the speaker the same way the edit's first shot does: centred on the face
go.textContent = 'tap to play ▶';
go.onclick = () => { go.style.display = 'none'; W.document.getElementById('gate').click(); };
V.addEventListener('pause', () => { bv.pause(); if (!V.ended) return; go.style.display = ''; go.textContent = 'tap to replay ▶'; });
V.addEventListener('play', () => { bv.currentTime = V.currentTime; bv.play().catch(() => {}); });
(function sync() { if (Math.abs(bv.currentTime - V.currentTime) > .08) bv.currentTime = V.currentTime; requestAnimationFrame(sync); })();
// frame grabs: both sides at edit time t (source clock)
window.__seek = async t => { go.style.display = 'none'; await W.__seek(t); bv.currentTime = V.currentTime; await new Promise(r => bv.addEventListener('seeked', r, { once: true })); };
window.__ready = true;
</script>
</body></html>
