<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ba5 recreation</title>
<style>
  @font-face { font-family: 'Inter Tight'; src: url('/assets/renderer/fonts/inter-tight-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Inter'; src: url('/assets/renderer/fonts/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'Playfair Italic'; src: url('./fonts/PlayfairDisplay-Italic-var.ttf') format('truetype'); font-weight: 400 900; font-style: italic; }
  @font-face { font-family: 'Poppins'; src: url('/assets/fonts/Poppins-SemiBold.ttf') format('truetype'); font-weight: 600; }
  :root { --ink: oklch(0.96 0.006 60); --ground: oklch(0.2 0.01 60); --muted: oklch(0.64 0.012 60); --accent: oklch(0.86 0.17 125); }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
  #stage { position: absolute; width: 1080px; height: 1920px; overflow: hidden; background: #e6e6e6; }
  #stage * { box-sizing: border-box; }
  .L { position: absolute; left: 0; top: 0; will-change: transform, opacity, filter; }
  #gate { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ground); z-index: 5; cursor: pointer; }
  #gate .box { text-align: center; }
  #gate .play { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; margin: 0 auto 14px; opacity: .35; }
  #gate.ready .play { opacity: 1; }
  #gate .play::after { content: ''; border-left: 26px solid var(--ink); border-top: 16px solid transparent; border-bottom: 16px solid transparent; margin-left: 6px; }
  #status { color: var(--muted); }
  #bar { position: fixed; left: 16px; right: 16px; bottom: 10px; height: 4px; background: oklch(0.32 0.01 60); border-radius: 2px; z-index: 4; cursor: pointer; }
  #bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"><i></i></div>
<div id="gate"><div class="box"><div class="play"></div><div id="status">Loading…</div></div></div>
<script type="module" src="./player.js"></script>
</body>
</html>
