<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ba2 recreation</title>
<style>
  :root { --ink: oklch(0.96 0.005 30); --ground: oklch(0.13 0.008 25); --muted: oklch(0.62 0.01 25); --accent: oklch(0.62 0.23 28); }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; overflow: hidden; }
  #stage { position: absolute; width: 1080px; height: 1920px; transform-origin: 0 0; background: #000; }
  #stage canvas { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #gate { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ground); z-index: 5; cursor: pointer; }
  #gate .box { text-align: center; }
  #gate .play { width: 84px; height: 84px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; margin: 0 auto 14px; opacity: .35; }
  #gate.ready .play { opacity: 1; }
  #gate .play::after { content: ''; border-left: 26px solid var(--ink); border-top: 16px solid transparent; border-bottom: 16px solid transparent; margin-left: 6px; }
  #status { color: var(--muted); }
  #bar { position: fixed; left: 16px; right: 16px; bottom: 10px; height: 4px; background: oklch(0.3 0.01 25); border-radius: 2px; z-index: 4; cursor: pointer; }
  #bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="out" width="1080" height="1920"></canvas></div></div>
<div id="bar"><i></i></div>
<div id="gate"><div class="box"><div class="play"></div><div id="status">Loading…</div></div></div>
<script type="module" src="./player.js"></script>
</body>
</html>
