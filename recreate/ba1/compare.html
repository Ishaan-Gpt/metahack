<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ba1 side by side</title>
<style>
  :root { --ink: oklch(0.95 0.006 30); --ground: oklch(0.14 0.008 25); --muted: oklch(0.64 0.012 25); --line: oklch(0.3 0.01 25); --accent: oklch(0.62 0.22 28); }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  main { height: 100%; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { font-weight: 600; }
  header .sp { flex: 1; }
  button { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #panes { display: flex; gap: 16px; justify-content: center; align-items: center; padding: 12px 16px; min-height: 0; }
  .pane { display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; min-height: 0; }
  .pane .lab { color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .frame { aspect-ratio: 9 / 16; height: calc(100% - 24px); max-width: calc(50vw - 32px); position: relative; background: #000; border-radius: 6px; overflow: hidden; }
  .frame video, .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  #gate { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ground); z-index: 3; cursor: pointer; }
  #gate .c { text-align: center; } #gate .p { width: 76px; height: 76px; border-radius: 50%; border: 2px solid var(--ink); margin: 0 auto 12px; display: grid; place-items: center; opacity: .35; }
  #gate.ready .p { opacity: 1; } #gate .p::after { content: ''; border-left: 24px solid var(--ink); border-top: 15px solid transparent; border-bottom: 15px solid transparent; margin-left: 6px; }
  #st { color: var(--muted); }
  @media (max-width: 700px) { #panes { gap: 8px; padding: 8px; } .frame { max-width: calc(50vw - 12px); } }
</style>
</head>
<body>
<main>
  <header>
    <b>ba1 · reference after panel | ours</b>
    <span class="sp"></span>
    <span style="color:var(--muted)">sound</span>
    <button id="sOurs" aria-pressed="true">Ours</button><button id="sRef" aria-pressed="false">Reference</button>
    <button id="replay">Replay</button>
  </header>
  <section id="panes">
    <div class="pane"><div class="lab">Reference (Hossein, BONOMI)</div><div class="frame"><video id="ref" src="/data/refs/edit-ba1/after1080.mp4" preload="auto" playsinline muted></video></div></div>
    <div class="pane"><div class="lab">Ours (live)</div><div class="frame"><iframe id="ours" src="./index.html?embed=1" allow="autoplay"></iframe></div></div>
  </section>
</main>
<div id="gate"><div class="c"><div class="p"></div><div id="st">Loading both…</div></div></div>
<script type="module">
const ref = document.getElementById('ref'), fr = document.getElementById('ours'), gate = document.getElementById('gate');
let soundOurs = true;
const refReady = new Promise(r => { if (ref.readyState >= 4) r(); else ref.addEventListener('canplaythrough', r, { once: true }); ref.load(); });
const oursReady = new Promise(r => { const t = setInterval(() => { try { if (fr.contentWindow.__ready) { clearInterval(t); r(); } } catch { } }, 200); });
await Promise.all([refReady, oursReady]);
document.getElementById('st').textContent = 'Ready: press play (both start together)';
gate.classList.add('ready');
const W = () => fr.contentWindow;
function setSound(o) { soundOurs = o; ref.muted = o; W().__mute?.(!o); document.getElementById('sOurs').setAttribute('aria-pressed', o); document.getElementById('sRef').setAttribute('aria-pressed', !o); }
async function start() { ref.pause(); ref.currentTime = 0; await W().__seek(0); setSound(soundOurs); ref.play(); W().__play(); }
gate.onclick = () => { gate.style.display = 'none'; start(); };
document.getElementById('replay').onclick = start;
document.getElementById('sOurs').onclick = () => setSound(true);
document.getElementById('sRef').onclick = () => setSound(false);
</script>
</body>
</html>
