<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>metahack player</title>
<style>
  :root { --ink: oklch(0.15 0.012 40); --paper: oklch(0.95 0.01 80); --mute: oklch(0.62 0.02 60); --hot: oklch(0.63 0.22 29); }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); font: 500 14px/1.4 system-ui, sans-serif; }
  main { height: 100%; display: grid; place-items: center; }
  canvas { max-height: calc(100vh - 64px); max-width: 100vw; display: block; background: #0d0b0a; border-radius: 10px; }
  #gate { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); z-index: 2; }
  #gate .box { text-align: center; }
  #gate p { color: var(--mute); margin: 6px 0 18px; min-height: 1.4em; }
  button { font: 600 15px/1 system-ui, sans-serif; color: var(--ink); background: var(--paper); border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer; }
  button[disabled] { opacity: .35; cursor: default; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; display: flex; gap: 12px; align-items: center; padding: 0 16px; }
  #bar button { padding: 8px 16px; font-size: 13px; }
  #seek { flex: 1; accent-color: var(--hot); }
  #info { color: var(--mute); font-variant-numeric: tabular-nums; min-width: 260px; text-align: right; }
</style>
</head>
<body>
<main><canvas id="out"></canvas></main>
<div id="gate"><div class="box"><strong>metahack</strong><p id="status">Loading…</p><button id="play" disabled>Play</button></div></div>
<div id="bar"><button id="pp">Pause</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="info"></span></div>
<script type="module" src="/player/player.js"></script>
</body>
</html>
